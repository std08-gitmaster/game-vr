<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Circuit Scanner & Python Logic</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; color: #00FF00; }
        
        /* วิดีโอพื้นหลัง (กล้อง) */
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* เลเยอร์ UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        
        /* แถบสถานะด้านบน */
        .top-bar { background: rgba(0, 20, 0, 0.8); padding: 15px; border-bottom: 2px solid #00FF00; display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; text-shadow: 0 0 5px #00FF00; pointer-events: auto; }
        
        /* กรอบสแกนเนอร์ตรงกลางจอ */
        .scanner-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .scanner-box { width: 250px; height: 250px; border: 2px dashed #00FF00; position: relative; box-shadow: inset 0 0 20px rgba(0,255,0,0.2); }
        .scanner-box::before, .scanner-box::after { content: ''; position: absolute; width: 20px; height: 20px; border: 4px solid #00FF00; }
        .scanner-box::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .scanner-box::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }
        
        /* เส้นเลเซอร์สแกน */
        .laser { width: 100%; height: 2px; background: red; position: absolute; top: 0; left: 0; box-shadow: 0 0 10px red; animation: scan 2s infinite linear; display: none; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }

        /* แผงควบคุมและคำถามด้านล่าง */
        .control-panel { background: rgba(0, 20, 0, 0.9); border-top: 2px solid #00FF00; padding: 15px; pointer-events: auto; text-align: center; }
        
        .code-block { background: #111; color: #d4d4d4; padding: 10px; text-align: left; border-left: 3px solid #007acc; font-family: 'Courier New', Courier, monospace; margin-bottom: 10px; font-size: 14px; white-space: pre-wrap; }
        .keyword { color: #569cd6; }
        .string { color: #ce9178; }

        .btn { background: transparent; color: #00FF00; border: 1px solid #00FF00; padding: 10px 20px; margin: 5px; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: bold; text-transform: uppercase; transition: all 0.3s; width: 90%; max-width: 300px; }
        .btn:hover, .btn:active { background: #00FF00; color: #000; }
        .btn-scan { background: #00FF00; color: #000; font-size: 18px; padding: 15px; box-shadow: 0 0 15px #00FF00; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 5px #00FF00; } 50% { box-shadow: 0 0 20px #00FF00; } 100% { box-shadow: 0 0 5px #00FF00; } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- พื้นหลังเป็นกล้องแบบ Real-time -->
    <video id="camera-feed" autoplay playsinline></video>

    <!-- เลเยอร์ UI ของระบบสแกน -->
    <div id="ui-layer">
        <div class="top-bar">
            <span id="mission-status">SYS_READY // MISSION: 1</span>
            <span>EXP: <span id="score">0</span></span>
        </div>

        <div class="scanner-container">
            <div class="scanner-box" id="scanner-box">
                <div class="laser" id="laser"></div>
            </div>
            <div id="instruction" style="position: absolute; bottom: 10%; background: rgba(0,0,0,0.7); padding: 5px; font-size: 14px;">
                หันกล้องไปที่หน้าจอ Tinkercad แล้วกด SCAN
            </div>
        </div>

        <div class="control-panel" id="panel-scan">
            <button class="btn btn-scan" onclick="startScan()">[ INITIALIZE SCAN ]</button>
        </div>

        <div class="control-panel hidden" id="panel-question">
            <div class="code-block" id="question-text">
<span class="keyword">def</span> <span class="string">analyze_circuit</span>():
    <span class="keyword">pass</span>
            </div>
            <button class="btn" id="ans-1" onclick="checkAnswer(true)">Choice 1</button>
            <button class="btn" id="ans-2" onclick="checkAnswer(false)">Choice 2</button>
        </div>
    </div>

    <script>
        // --- ส่วนควบคุมกล้อง WebRTC ---
        async function initCamera() {
            try {
                // พยายามเปิดกล้องหลัง (environment)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                document.getElementById('camera-feed').srcObject = stream;
            } catch (err) {
                alert("ไม่สามารถเปิดกล้องได้: โปรดอนุญาตการเข้าถึงกล้องในเบราว์เซอร์");
                console.error(err);
            }
        }
        
        // เรียกใช้งานกล้องเมื่อโหลดหน้าเว็บ
        window.onload = initCamera;

        // --- ส่วนตรรกะเกม ---
        let currentMission = 1;
        let score = 0;
        let firstTry = true;

        const missions = [
            {
                type: "วงจรอนุกรม",
                question: "<span class='keyword'>if</span> switch_1 == <span class='keyword'>True</span> ___ switch_2 == <span class='keyword'>True</span>:\n    light_bulb.on()\n\n# จากวงจรบนจอ (อนุกรม) ควรเติม Operator ใด?",
                answers: ["and", "or"],
                correct: 0
            },
            {
                type: "วงจรขนาน",
                question: "<span class='keyword'>if</span> switch_A == <span class='keyword'>True</span> ___ switch_B == <span class='keyword'>True</span>:\n    light_bulb.on()\n\n# จากวงจรบนจอ (ขนาน) ควรเติม Operator ใด?",
                answers: ["and", "or"],
                correct: 1
            },
            {
                type: "วงจรผสม",
                question: "# ไฟดวงแรกอนุกรม ดวงที่สองและสามขนานกัน\n<span class='keyword'>if</span> s1 == <span class='keyword'>True</span> <span class='keyword'>and</span> (s2 == <span class='keyword'>True</span> ___ s3 == <span class='keyword'>True</span>):\n    system.start()",
                answers: ["and", "or"],
                correct: 1
            }
        ];

        function startScan() {
            // แสดงเอฟเฟกต์สแกน
            document.getElementById('laser').style.display = 'block';
            document.getElementById('panel-scan').classList.add('hidden');
            document.getElementById('instruction').innerText = "ANALYZING TARGET...";
            
            // จำลองเวลาประมวลผล AI 1.5 วินาที
            setTimeout(() => {
                document.getElementById('laser').style.display = 'none';
                document.getElementById('instruction').innerText = "TARGET ACQUIRED";
                showQuestion();
            }, 1500);
        }

        function showQuestion() {
            let m = missions[currentMission - 1];
            document.getElementById('panel-question').classList.remove('hidden');
            
            // แสดงคำถามแบบมี Syntax Highlight จำลอง
            document.getElementById('question-text').innerHTML = m.question;
            
            document.getElementById('ans-1').innerText = m.answers[0];
            document.getElementById('ans-2').innerText = m.answers[1];
            
            document.getElementById('ans-1').onclick = () => checkAnswer(m.correct === 0);
            document.getElementById('ans-2').onclick = () => checkAnswer(m.correct === 1);
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                let points = 50 + (firstTry ? 10 : 0);
                score += points;
                document.getElementById('score').innerText = score;
                
                alert(`[ SUCCESS ] คอมไพล์โค้ดผ่าน!\nได้รับ ${points} EXP`);
                nextMission();
            } else {
                firstTry = false;
                alert("[ SYNTAX ERROR ] การไหลของกระแสไฟไม่ตรงกับ Operator ลองตรวจสอบวงจรใหม่!");
            }
        }

        function nextMission() {
            currentMission++;
            firstTry = true;
            document.getElementById('panel-question').classList.add('hidden');
            
            if (currentMission > missions.length) {
                document.getElementById('instruction').classList.add('hidden');
                document.getElementById('scanner-box').classList.add('hidden');
                document.getElementById('panel-scan').classList.remove('hidden');
                document.getElementById('panel-scan').innerHTML = `
                    <h2 style="color:#00FF00;">>>> MISSION COMPLETE <<<</h2>
                    <p>รันโปรแกรมสำเร็จ! Total EXP: ${score}</p>
                    <p>ระบบเข้าใจการแปลงฮาร์ดแวร์สู่ลอจิกโปรแกรมแล้ว</p>
                `;
            } else {
                document.getElementById('mission-status').innerText = `SYS_READY // MISSION: ${currentMission}`;
                document.getElementById('instruction').innerText = `หันกล้องสแกนหน้าจอคอมพิวเตอร์ (${missions[currentMission-1].type})`;
                document.getElementById('panel-scan').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
