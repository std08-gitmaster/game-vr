<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Circuit Master - Active Learning</title>
    <!-- โหลด A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        /* ตกแต่งส่วน UI ที่ซ้อนทับบนหน้าจอกล้อง */
        body { margin: 0; overflow: hidden; font-family: 'Sarabun', sans-serif; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; box-sizing: border-box; }
        .top-bar { display: flex; justify-content: space-between; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; color: white; pointer-events: auto; }
        .progress { display: flex; gap: 5px; }
        .bulb-icon { width: 20px; height: 20px; border-radius: 50%; background: gray; }
        .bulb-icon.active { background: #FFDC00; box-shadow: 0 0 10px #FFDC00; }
        .mission-panel { background: rgba(255,255,255,0.9); padding: 15px; border-radius: 10px; pointer-events: auto; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { padding: 10px 20px; background: #0074D9; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        .btn-hint { background: #FF851B; }
        .hidden { display: none !important; }
        #question-box { background: #FFDC00; padding: 10px; border-radius: 5px; margin: 10px 0; font-weight: bold; }
        .answer-btn { background: #2ECC40; margin: 5px; width: 45%; }
    </style>
</head>
<body>

    <!-- UI Overlay สำหรับโต้ตอบกับผู้เรียน -->
    <div id="ui-layer">
        <div class="top-bar">
            <div>คะแนน: <span id="score">0</span>/100</div>
            <div class="progress" id="progress-bar">
                <div class="bulb-icon" id="bulb-1"></div>
                <div class="bulb-icon" id="bulb-2"></div>
                <div class="bulb-icon" id="bulb-3"></div>
                <div class="bulb-icon" id="bulb-4"></div>
            </div>
        </div>

        <div class="mission-panel" id="mission-panel">
            <h2 id="mission-title">ภารกิจที่ 1: กำเนิดพลังงาน</h2>
            <p id="mission-desc">เปิดรูปวงจรบนหน้าจออีกเครื่อง แล้วหันกล้องมาสแกนเพื่อเริ่มภารกิจ</p>
            <p id="marker-status" aria-live="polite">กำลังรอการสแกนรูปวงจร...</p>
            <div id="question-box" class="hidden">
                <p id="question-text">คำถามจะปรากฏที่นี่</p>
                <button class="btn answer-btn" onclick="checkAnswer(true)" id="ans-1">ตัวเลือก 1</button>
                <button class="btn answer-btn" onclick="checkAnswer(false)" id="ans-2">ตัวเลือก 2</button>
            </div>
            <button class="btn btn-hint" id="hint-btn" onclick="useHint()">💡 คำใบ้</button>
        </div>
    </div>

    <!-- 3D AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse">
        <a-marker
            id="circuit-marker"
            type="pattern"
            url="markers/circuit-marker.patt">
            <!-- องค์ประกอบวงจร -->
            <a-entity id="circuit-board" position="0 0 0">
                <!-- แบตเตอรี่ -->
                <a-box id="battery" class="clickable" position="-1 0.2 0" depth="0.4" height="0.4" width="0.8" color="#FF4136"></a-box>
                <a-text value="Battery" position="-1 0.7 0" align="center" color="red" scale="0.5 0.5 0.5"></a-text>

                <!-- หลอดไฟ -->
                <a-sphere id="lightbulb" class="clickable" position="1 0.3 0" radius="0.3" color="#CCCCCC" material="emissive: #000000"></a-sphere>
                <a-text value="Light Bulb" position="1 0.8 0" align="center" color="yellow" scale="0.5 0.5 0.5"></a-text>

                <!-- สายไฟ (ซ่อนไว้ก่อน จะแสดงเมื่อต่อวงจร) -->
                <a-cylinder id="wire" position="0 0.1 0" radius="0.03" height="1.8" color="#111111" rotation="0 0 90" visible="false"></a-cylinder>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // ระบบ State ของเกม
        let currentMission = 1;
        let score = 0;
        let firstTry = true;
        let circuitConnected = false;

        // ข้อมูลภารกิจ
        const missions = [
            {
                title: "ภารกิจที่ 1: กำเนิดพลังงาน",
                desc: "แตะที่แบตเตอรี่ และหลอดไฟ เพื่อต่อสายไฟให้วงจรทำงาน",
                question: "กระแสไฟฟ้าจะไหลออกจากขั้วใดของแบตเตอรี่เสมอ?",
                answers: ["ขั้วบวก ไป ขั้วลบ", "ขั้วลบ ไป ขั้วบวก"],
                correct: 0,
                hint: "กระแสไฟฟ้าไหลจากศักย์ไฟฟ้าสูงไปต่ำ (บวกไปลบ)"
            },
            {
                title: "ภารกิจที่ 2: เส้นทางเดียว (อนุกรม)",
                desc: "จำลองการต่อวงจร หากหลอดไฟดวงหนึ่งขาด จะเกิดอะไรขึ้น?",
                question: "ในวงจรอนุกรม หากหลอดไฟขาด 1 ดวง ที่เหลือจะเป็นอย่างไร?",
                answers: ["สว่างปกติ", "ดับทั้งหมด"],
                correct: 1,
                hint: "วงจรอนุกรมมีเส้นทางเดินของกระแสไฟฟ้าเพียงเส้นทางเดียว"
            }
            // สามารถเพิ่มภารกิจที่ 3 และ 4 ได้ตามโครงสร้าง
        ];

        // ระบบปฏิสัมพันธ์ AR (แตะเพื่อเชื่อมต่อ)
        document.getElementById('battery').addEventListener('click', connectCircuit);
        document.getElementById('lightbulb').addEventListener('click', connectCircuit);

        // ใช้รูปวงจรบนหน้าจออีกเครื่องเป็น Marker สำหรับเริ่มภารกิจ
        const marker = document.getElementById('circuit-marker');
        const markerStatus = document.getElementById('marker-status');
        marker.addEventListener('markerFound', () => {
            markerStatus.innerText = 'พบรูปวงจรแล้ว แตะอุปกรณ์เพื่อเชื่อมต่อวงจร';
        });
        marker.addEventListener('markerLost', () => {
            markerStatus.innerText = 'ไม่พบรูปวงจร หันกล้องกลับไปที่หน้าจออีกเครื่อง';
        });

        function connectCircuit() {
            if (!circuitConnected) {
                // แสดงสายไฟและเปิดไฟ
                document.getElementById('wire').setAttribute('visible', 'true');
                document.getElementById('lightbulb').setAttribute('material', 'emissive: #FFDC00; emissiveIntensity: 1');
                document.getElementById('lightbulb').setAttribute('color', '#FFDC00');
                circuitConnected = true;
                
                // แสดงคำถาม
                showQuestion();
            }
        }

        function showQuestion() {
            let m = missions[currentMission - 1];
            document.getElementById('question-box').classList.remove('hidden');
            document.getElementById('question-text').innerText = m.question;
            document.getElementById('ans-1').innerText = m.answers[0];
            document.getElementById('ans-2').innerText = m.answers[1];
            
            // ตั้งค่าการตรวจสอบคำตอบ (0 คือปุ่มแรกถูก, 1 คือปุ่มสองถูก)
            document.getElementById('ans-1').onclick = () => checkAnswer(m.correct === 0);
            document.getElementById('ans-2').onclick = () => checkAnswer(m.correct === 1);
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                let points = 20 + (firstTry ? 5 : 0);
                score += points;
                document.getElementById('score').innerText = score;
                document.getElementById(`bulb-${currentMission}`).classList.add('active');
                
                alert(`ถูกต้อง! ได้รับ ${points} คะแนน\nปลดล็อก Badge!`);
                nextMission();
            } else {
                firstTry = false;
                alert("ยังไม่ถูกต้อง ลองคิดดูใหม่ หรือใช้คำใบ้สิ!");
            }
        }

        function useHint() {
            let m = missions[currentMission - 1];
            alert("คำใบ้: " + m.hint);
            firstTry = false; // ใช้คำใบ้จะอดโบนัส
        }

        function nextMission() {
            currentMission++;
            firstTry = true;
            circuitConnected = false;
            document.getElementById('question-box').classList.add('hidden');

            if (currentMission > missions.length) {
                endGame();
            } else {
                // รีเซ็ต AR สำหรับด่านต่อไป
                document.getElementById('wire').setAttribute('visible', 'false');
                document.getElementById('lightbulb').setAttribute('material', 'emissive: #000000');
                document.getElementById('lightbulb').setAttribute('color', '#CCCCCC');
                
                let m = missions[currentMission - 1];
                document.getElementById('mission-title').innerText = m.title;
                document.getElementById('mission-desc').innerText = m.desc;
            }
        }

        // ระบบบันทึกข้อมูลและสรุปผล
        function endGame() {
            document.getElementById('mission-panel').innerHTML = `
                <h2>ยินดีด้วย! คุณกอบกู้เมืองพลังงานสำเร็จ!</h2>
                <p>คะแนนรวมของคุณคือ: <strong>${score}/100</strong></p>
                <button class="btn" onclick="saveData()">บันทึกคะแนน</button>
            `;
        }

        function saveData() {
            // ระบบส่งข้อมูลไปยัง Google Sheets ผ่าน Webhook (Google Apps Script)
            const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_WEBAPP_URL_HERE'; 
            
            // ข้อมูลจำลองของนักเรียนที่ดึงมาจากระบบ Login หรือ Google Forms
            const studentData = {
                student_id: "M1_Student",
                score: score,
                timestamp: new Date().toISOString()
            };

            // หากมีการตั้งค่า Google Apps Script Web App ให้ปลดคอมเมนต์โค้ดด้านล่างเพื่อใช้งาน
            /*
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            }).then(() => {
                alert('บันทึกคะแนนลง Google Sheets เรียบร้อยแล้ว!');
            }).catch(err => console.error('Error!', err.message));
            */
            
            alert('บันทึกคะแนนเรียบร้อย! (จำลองการส่งข้อมูลไป Google Sheets)');
        }
    </script>
</body>
</html>
